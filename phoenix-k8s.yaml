# Arize Phoenix — self-hosted LLM observability
#
# Deploy:
#   kubectl apply -f phoenix-k8s.yaml
#
# Access UI:
#   kubectl port-forward svc/phoenix 6006:6006 -n phoenix
#   Open http://localhost:6006
#
# OTLP endpoint (for OTel collector):
#   HTTP: http://phoenix.phoenix.svc.cluster.local:6006
---
apiVersion: v1
kind: Namespace
metadata:
  name: phoenix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
    spec:
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:latest
          ports:
            - containerPort: 6006
              name: http
            - containerPort: 4317
              name: otlp-grpc
          env:
            - name: PHOENIX_WORKING_DIR
              value: "/tmp/phoenix"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /tmp/phoenix
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: phoenix
spec:
  selector:
    app: phoenix
  ports:
    - name: http
      port: 6006
      targetPort: 6006
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
