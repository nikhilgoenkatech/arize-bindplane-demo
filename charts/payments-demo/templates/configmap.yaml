apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payments-demo.fullname" . }}-config
  labels:
    {{- include "payments-demo.labels" . | nindent 4 }}
data:
  TRANSACTIONS_PER_MINUTE: {{ .Values.generator.transactionsPerMinute | quote }}
  PAYMENT_TYPE_WEIGHTS: {{ .Values.generator.paymentTypeWeights | quote }}
  SCENARIO_WEIGHTS: {{ .Values.generator.scenarioWeights | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
