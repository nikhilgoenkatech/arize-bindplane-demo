# Helm values — OTel Demo vanilla setup with Dynatrace
#
# Prerequisites:
#   1. Create LLM secret:
#      kubectl create secret generic llm-secret \
#        --from-literal=api-key=<your-openai-api-key>
#
#   2. Deploy:
#      helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
#      helm repo update
#      helm upgrade --install otel-demo open-telemetry/opentelemetry-demo -f k8s-values-vanilla.yaml

# =============================================================================
# Expose frontend-proxy as LoadBalancer (AWS ELB) — persists across helm upgrades
# =============================================================================
components:
  frontendProxy:
    service:
      type: LoadBalancer

# =============================================================================
# Disable bundled observability — Dynatrace replaces Jaeger/Grafana/Prometheus
# =============================================================================
jaeger:
  enabled: false
grafana:
  enabled: false
prometheus:
  enabled: false
opensearch:
  enabled: false

# =============================================================================
# OTel Collector — forward all signals to Dynatrace telemetry-ingest collector
# Already running in cluster: telemetry-ingest.dynatrace.svc.cluster.local:4317
# No API token needed — the DT collector handles auth to Dynatrace.
# =============================================================================
opentelemetry-collector:
  config:
    exporters:
      otlp/dynatrace:
        endpoint: "telemetry-ingest.dynatrace.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      # Disable self-telemetry — no standalone otel-collector service in Helm deployment
      telemetry:
        metrics:
          level: none

      pipelines:
        traces:
          # span_metrics must stay here — it is also a receiver in the metrics pipeline
          exporters: [debug, span_metrics, otlp/dynatrace]
        metrics:
          exporters: [debug, otlp/dynatrace]
        logs:
          exporters: [debug, otlp/dynatrace]
        profiles:
          exporters: [debug]

# =============================================================================
# Chatbot — LLM model config
# Swap LLM_MODEL for the bad/good model demo (no other changes needed)
# =============================================================================
components:
  accounting:
    resources:
      limits:
        memory: "512Mi"

  chatbot:
    env:
      - name: CHATBOT_PORT
        value: "7860"   # override K8s service-discovery injection (tcp://...:7860)
      - name: CHATBOT_ROOT_PATH
        value: "/chatbot"   # required for Gradio to use correct API paths behind proxy
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector:4318"   # collector service in this namespace
      - name: LLM_BASE_URL
        value: "https://api.openai.com/v1"
      - name: LLM_MODEL
        value: "gpt-4o"
      - name: API_KEY
        valueFrom:
          secretKeyRef:
            name: llm-secret
            key: api-key
      - name: USE_VCR
        value: "False"
