apiVersion: batch/v1
kind: Job
metadata:
  name: jmeter-loadtest
  namespace: llm-obs-demo
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      annotations:
        oneagent.dynatrace.com/inject: "false"
    spec:
      restartPolicy: Never
      containers:
        - name: jmeter
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              BASE_URL="http://frontend-proxy:8080"
              RELEASE="${RELEASE_VERSION}"
              END=$(($(date +%s) + 120))
              echo "Load test started: release=${RELEASE} duration=120s"
              while [ $(date +%s) -lt $END ]; do
                curl -sf -o /dev/null \
                  -H "x-load-test-id: ${RELEASE}" \
                  -H "x-load-test-scenario: otelshop-browse-flow" \
                  -H "x-load-test-tool: jmeter" \
                  -H "x-load-test-vusers: 10" \
                  -H "x-release-version: ${RELEASE}" \
                  "${BASE_URL}/api/products" &
                curl -sf -o /dev/null \
                  -H "x-load-test-id: ${RELEASE}" \
                  -H "x-load-test-scenario: otelshop-browse-flow" \
                  -H "x-load-test-tool: jmeter" \
                  -H "x-load-test-vusers: 10" \
                  -H "x-release-version: ${RELEASE}" \
                  "${BASE_URL}/api/cart" &
                curl -sf -o /dev/null \
                  -H "x-load-test-id: ${RELEASE}" \
                  -H "x-load-test-scenario: otelshop-browse-flow" \
                  -H "x-load-test-tool: jmeter" \
                  -H "x-load-test-vusers: 10" \
                  -H "x-release-version: ${RELEASE}" \
                  "${BASE_URL}/api/recommendations" &
                sleep 2
              done
              wait
              echo "Load test complete."
          env:
            - name: RELEASE_VERSION
              value: "dev"
